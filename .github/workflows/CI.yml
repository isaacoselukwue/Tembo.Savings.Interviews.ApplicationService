name: .NET Core CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ApplicationService.sln

    - name: Build
      run: dotnet build ApplicationService.sln --no-restore

    - name: Test
      run: dotnet test ApplicationService.sln --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/test-results.trx'
